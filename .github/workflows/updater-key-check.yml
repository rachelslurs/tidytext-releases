name: Updater key self-check

# One-off: confirms the Tauri updater PRIVATE key in the `release` env secret corresponds to the
# PUBLIC key embedded in the app. Signs a throwaway file with the secret, verifies it against the
# pinned pubkey. Prints PASS/FAIL only — no secret value is ever printed. Runs behind the same
# approval gate as a release. DELETE this file once you've confirmed the keypair.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  key-check:
    runs-on: ubuntu-latest
    environment: release          # <- the only place TAURI_SIGNING_PRIVATE_KEY is readable
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Sign with the env secret, verify against the embedded pubkey
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY_B64: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDYzRUVDRjQyQTY5MjM2NDAKUldSQU5wS21Rcy91WXc0YmViUGlPVmVzTXBINHlGNi9VTDMvRnlEd0VVTlQvRHR3UHY5WDlDTGgK
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          # Materialize the keypair files. Tauri stores both as base64 of the minisign key file,
          # so base64 -d gives standard minisign files. Nothing is echoed.
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > sk.key
          printf '%s' "$PUBKEY_B64" | base64 -d > updater.pub

          echo "updater keypair self-check" > probe.txt
          # Sign (password read from stdin — runner has no tty, so minisign reads it there).
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s sk.key -m probe.txt
          # Verify the produced probe.txt.minisig against the embedded pubkey (no password needed).
          if minisign -V -p updater.pub -m probe.txt; then
            echo "✓ PASS: release-env private key matches pubkey (key ID 63EECF42A6923640)"
          else
            echo "::error::FAIL: the release-env private key does NOT match the embedded pubkey"
            exit 1
          fi
