name: Release preflight (config doctor)

# On-demand check that the `release` environment is fully configured BEFORE you cut a real release.
# It reads the release secrets, so it runs behind the SAME approval gate as a release — but it
# builds NOTHING. It verifies: each required secret is present, the read PAT can reach the source
# repo, the Apple key/cert decode, AND the Tauri updater PRIVATE key matches the PUBLIC key the app
# will ship — read from src-tauri/tauri.conf.json AT THE RELEASE TAG (so a mismatch can't silently
# brick the v1->v2 auto-update for every user). NO secret value is ever printed. Run it after
# rotating the PAT, rotating the updater signing key, or changing any secret.
#
# Pass the `version` input so the keypair is validated against the EXACT tag the build will embed,
# NOT the default branch: release.yml checks out the source at v<version>, so if a rotation lands on
# main after the tag is cut (or the tag was cut from an older commit), main's pubkey and the tag's
# differ — validating main would go green while the build ships the tag's (mismatched) key. With no
# version, the keypair is checked against the default branch and the run WARNS that it did not
# validate a release tag.
#
# Why not on push? These are ENVIRONMENT secrets, readable only by a job that declares
# `environment: release` — which triggers the approval gate. So a silent per-push secret check
# isn't possible; this is the deliberate, gated, on-demand equivalent.
#
# The "Validate release configuration" step is kept intentionally identical to the "Preflight" step
# in release.yml — keep those two in sync. The updater-keypair check here is the FAIL-FAST doctor;
# the AUTHORITATIVE gate is the in-build check in release.yml, which validates the exact
# tauri.conf.json the build checked out at the tag (immune to preflighting a different/forced/skipped
# tag, or the no-version path). Both call the shared .github/scripts/verify-updater-keypair.sh — one
# logic, two pubkey sources (this doctor fetches via gh api at the ref; the build reads its working
# tree).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to validate, e.g. 0.1.3 — checks the updater keypair against src-tauri/tauri.conf.json at tag v<version>. Blank = secrets-only + keypair vs the default branch (warns).'
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # This repo's own CI scripts (the shared keypair verifier). Sparse — just the scripts dir.
      - name: Check out CI scripts (this repo)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Validate release configuration
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          GH_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          SOURCE_CHECKOUT_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for v in SOURCE_REPO SOURCE_CHECKOUT_TOKEN APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_API_KEY_BASE64 APPLE_API_KEY APPLE_API_ISSUER APPLE_SIGNING_IDENTITY \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing 'release' environment secrets: ${missing[*]}"; exit 1
          fi
          printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A 2>/dev/null | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_BASE64 does not decode to a PEM private key"; exit 1; }
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A >/dev/null 2>&1 \
            || { echo "::error::APPLE_CERTIFICATE is not valid base64 (.p12)"; exit 1; }
          gh api "repos/${SOURCE_REPO}" --jq '.full_name' >/dev/null 2>&1 \
            || { echo "::error::SOURCE_CHECKOUT_TOKEN cannot reach SOURCE_REPO — check the PAT scope/expiry and the SOURCE_REPO value"; exit 1; }
          echo "✓ release configuration present and sane (secrets set; PAT reaches source; Apple key decodes)"
          {
            echo "## ✓ Release preflight passed"
            echo ""
            echo "All \`release\` environment secrets are present, the read PAT can reach the source"
            echo "repo, and the Apple key/cert decode. Safe to cut a release."
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail-fast updater-keypair doctor: confirm the `release` signing key is the counterpart of the
      # pubkey the app will SHIP, read AT THE RELEASE TAG (the ref release.yml checks out and embeds)
      # — not the default branch, so a rotation that landed on main after the tag, or a tag cut from an
      # older commit, can't pass here while the build ships a different key. With no `version` it falls
      # back to the default branch and WARNS. The AUTHORITATIVE gate is release.yml's in-build check
      # (it validates the exact checked-out bytes); this one just surfaces drift early, before build
      # minutes. Sign+verify is shared via .github/scripts/verify-updater-keypair.sh.
      - name: Verify updater keypair (signing key ↔ pubkey at the release tag)
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          GH_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ github.event.inputs.version }} # via env, never inlined in the script (injection-safe)
        run: |
          set -euo pipefail
          # Validate against the SAME ref the build embeds: the release tag if given, else the default
          # branch (with a loud warning — the in-build check is the real gate in that case).
          if [ -n "${VERSION:-}" ]; then
            REF="v${VERSION#v}" # tolerate a leading 'v'
            gh api "repos/${SOURCE_REPO}/git/ref/tags/${REF}" --jq '.object.sha' >/dev/null 2>&1 \
              || { echo "::error::source tag ${REF} not found in SOURCE_REPO — push/confirm the source tag before validating the keypair"; exit 1; }
          else
            REF="$(gh api "repos/${SOURCE_REPO}" --jq '.default_branch')"
            echo "::warning::no version provided — validating against the default branch (${REF}), NOT a release tag. release.yml's in-build check is the authoritative gate; re-run here with the version to fail fast on the exact tag."
          fi
          # Source the pubkey from tauri.conf.json AT THAT REF (contents .content is base64 of the file),
          # then hand it to the shared verifier (preflight's pubkey source = gh api at the ref).
          PUBKEY_B64="$(gh api "repos/${SOURCE_REPO}/contents/src-tauri/tauri.conf.json?ref=${REF}" \
            --jq '.content' | base64 -d | jq -r '.plugins.updater.pubkey')"
          echo "Validating updater keypair against ${REF}"
          bash .github/scripts/verify-updater-keypair.sh --pubkey-b64 "$PUBKEY_B64"
