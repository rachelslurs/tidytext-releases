name: Release preflight (config doctor)

# On-demand check that the `release` environment is fully configured BEFORE you cut a real release.
# It reads the release secrets, so it runs behind the SAME approval gate as a release — but it
# builds NOTHING. It verifies: each required secret is present, the read PAT can reach the source
# repo, the Apple key/cert decode, AND the Tauri updater PRIVATE key matches the PUBLIC key
# published in src-tauri/tauri.conf.json (so a shipped v1 can verify a v2 auto-update — a mismatch
# would silently brick updates for every user). NO secret value is ever printed. Run it after
# rotating the PAT, rotating the updater signing key, or changing any secret.
#
# Why not on push? These are ENVIRONMENT secrets, readable only by a job that declares
# `environment: release` — which triggers the approval gate. So a silent per-push secret check
# isn't possible; this is the deliberate, gated, on-demand equivalent.
#
# The "Validate release configuration" step is kept intentionally identical to the "Preflight" step
# in release.yml — keep those two in sync. The updater-keypair step is doctor-only (release.yml
# already asserts the updater wiring against the source it checks out); mirror it there too if you
# want the keypair asserted before the ~30-min build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Validate release configuration
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          GH_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          SOURCE_CHECKOUT_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for v in SOURCE_REPO SOURCE_CHECKOUT_TOKEN APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_API_KEY_BASE64 APPLE_API_KEY APPLE_API_ISSUER APPLE_SIGNING_IDENTITY \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing 'release' environment secrets: ${missing[*]}"; exit 1
          fi
          printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A 2>/dev/null | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_BASE64 does not decode to a PEM private key"; exit 1; }
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A >/dev/null 2>&1 \
            || { echo "::error::APPLE_CERTIFICATE is not valid base64 (.p12)"; exit 1; }
          gh api "repos/${SOURCE_REPO}" --jq '.full_name' >/dev/null 2>&1 \
            || { echo "::error::SOURCE_CHECKOUT_TOKEN cannot reach SOURCE_REPO — check the PAT scope/expiry and the SOURCE_REPO value"; exit 1; }
          echo "✓ release configuration present and sane (secrets set; PAT reaches source; Apple key decodes)"
          {
            echo "## ✓ Release preflight passed"
            echo ""
            echo "All \`release\` environment secrets are present, the read PAT can reach the source"
            echo "repo, and the Apple key/cert decode. Safe to cut a release."
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify the updater keypair: the PRIVATE key in this `release` env must match the PUBLIC key
      # the app actually ships. The pubkey is read from its SOURCE OF TRUTH — src-tauri/tauri.conf.json
      # on the source repo's default branch — so there is no second copy of it to drift. A mismatch
      # means a shipped v1 could never verify a v2 update (silent breakage for every user), so it
      # FAILS the doctor. No secret value is printed; the private key only ever lands in a file on this
      # ephemeral runner. The source repo is named solely via the SOURCE_REPO secret.
      - name: Verify updater keypair (release signing key ↔ published pubkey)
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          GH_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          # Pull the published pubkey from the source of truth (base64 of a minisign public-key file).
          PUBKEY_B64="$(gh api "repos/${SOURCE_REPO}/contents/src-tauri/tauri.conf.json" \
            --jq '.content' | base64 -d | jq -r '.plugins.updater.pubkey')"
          { [ -n "$PUBKEY_B64" ] && [ "$PUBKEY_B64" != "null" ]; } \
            || { echo "::error::could not read plugins.updater.pubkey from src-tauri/tauri.conf.json in SOURCE_REPO"; exit 1; }

          # Materialize the keypair files (Tauri stores both as base64 of the minisign key file).
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > sk.key
          printf '%s' "$PUBKEY_B64" | base64 -d > updater.pub

          echo "updater keypair self-check" > probe.txt
          # Sign with the secret (password via stdin — the runner has no tty), then verify the produced
          # probe.txt.minisig against the published pubkey (verify needs no password).
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | minisign -S -s sk.key -m probe.txt
          if minisign -V -p updater.pub -m probe.txt; then
            KEYID="$(grep -oE '[0-9A-F]{16}' updater.pub | head -1)"
            echo "✓ updater keypair OK — release signing key matches the published pubkey (key ID ${KEYID})"
            {
              echo "## ✓ Updater keypair verified"
              echo ""
              echo "The \`release\` signing key matches the updater public key published in"
              echo "\`src-tauri/tauri.conf.json\` (key ID ${KEYID}); the auto-update trust chain is sound."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::updater keypair MISMATCH — TAURI_SIGNING_PRIVATE_KEY does not match the pubkey in tauri.conf.json; a shipped v1 could never verify a v2 auto-update"
            exit 1
          fi
