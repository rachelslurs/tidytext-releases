name: Release (TidyText Offline)

# Canonical release pipeline for TidyText Offline.
#
# This repo is PUBLIC and exists to serve releases (the updater's latest.json + the .dmg) to
# anonymous clients. The app SOURCE lives in a separate PRIVATE repo — its full path is the
# SOURCE_REPO secret, so it is NOT named in this world-readable file — and is checked out here at
# the release tag via a read-only PAT. We build, sign (Apple Developer ID),
# notarize, and publish the GitHub Release to THIS repo on free public-repo macOS minutes.
#
# Treat this job as HOSTILE-UNTIL-HARDENED — the Apple cert and the Tauri updater signing key are
# present on a world-readable surface. Controls (see also the repo settings, which are not in code):
#   • All signing material lives in the protected `release` Environment (env secrets, required
#     reviewer, v* tag deployment rule). A run PAUSES at the env gate until Rachel approves.
#   • Triggers are tag-push / manual dispatch ONLY — no pull_request (a fork PR can't see secrets
#     and can't reach this job).
#   • Top-level permissions are read-only; only this job elevates to contents: write.
#   • Every action is pinned to a full commit SHA.
#   • step-security/harden-runner runs first to lock egress (audit on the first release, then block).
#   • CODEOWNERS gates edits to this file behind required review.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.3) — workflow_dispatch ALWAYS publishes as a prerelease'
        required: true

# Dedupe on the ref, but never cancel mid-publish (a half-uploaded release leaves the updater
# pointing at a broken latest.json).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: read by default. The single release job elevates to contents: write to publish.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ONE job: checkout → build → sign → notarize → publish. The read PAT and the signing keys are
  # `release` ENVIRONMENT secrets, readable only by a job that declares `environment: release`, so
  # the whole chain runs behind a single approval. (Splitting into an ungated build job + a gated
  # publish job would put the private-source checkout in front of the gate.)
  release:
    runs-on: macos-latest
    timeout-minutes: 60 # fail a hung notarization instead of burning the default
    environment: release
    permissions:
      contents: write # the job's GITHUB_TOKEN publishes the release to THIS public repo
    steps:
      # 1) Lock egress FIRST, before any other code runs. harden-runner supports macOS as of the
      #    Feb-2026 release; v2.19.4 is past the DNS-over-TCP/HTTPS bypass fixes (>=2.16.0).
      #    BLOCK mode: allowlist locked from the audited v0.9.1-rc.1 + v0.9.2-rc.1 runs (the
      #    step-security recommended egress policy), plus tidytext.cc:443 for the branded-download
      #    check — that check is gated to full releases, so the prerelease audit never exercised it.
      #    The branded follow (curl -L) traverses ALL hops: tidytext.cc → github.com →
      #    release-assets.githubusercontent.com (verified live), so all three hosts must stay allowed
      #    — don't trim to just the entry host. github.com + release-assets were already here for the
      #    raw checks. `disable-telemetry: true` keeps build metadata
      #    off the SS backend while egress ENFORCEMENT still works, so that backend need not be
      #    allowlisted. If a future toolchain/CDN bump needs a new host, the build fails LOUDLY
      #    naming the blocked endpoint — add it here (it's just hostnames, no secret).
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            *.apple.com:443
            0.pool.ntp.org:123
            api.apple-cloudkit.com:443
            api.apple-cloudkit.fe2.apple-dns.net:443
            api.github.com:443
            apple-relay.fastly-edge.com:443
            c.apple.news:443
            configuration-lb.ls-apple.com.akadns.net:443
            configuration-row-lb.apple.com.akadns.net:443
            gateway.icloud.com:443
            ghcr.io:443
            github.com:443
            help.origin-apple.com.akadns.net:443
            index.crates.io:443
            ipcdn-lb.apple.com.akadns.net:443
            mask.icloud.com:443
            mesu-cdn.origin-apple.com.akadns.net:443
            notary-submissions-prod.s3-accelerate.amazonaws.com:443
            ocsp.digicert.com:80
            pkg-containers.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            tidytext.cc:443
            timestamp.apple.com:80
            updates.cdn-apple.com:443
            uploads.github.com:443

      # Fail fast: validate the `release` environment is fully configured BEFORE the ~30-min build.
      # This job is gated on `release`, so it can read the env secrets; it checks each is present,
      # that the read PAT can actually reach the source repo, and that the Apple key/cert decode.
      # NO secret value is ever printed. Keep in sync with preflight.yml (the on-demand doctor).
      - name: Preflight — validate release configuration
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          GH_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          SOURCE_CHECKOUT_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for v in SOURCE_REPO SOURCE_CHECKOUT_TOKEN APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                   APPLE_API_KEY_BASE64 APPLE_API_KEY APPLE_API_ISSUER APPLE_SIGNING_IDENTITY \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing 'release' environment secrets: ${missing[*]}"; exit 1
          fi
          printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A 2>/dev/null | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_BASE64 does not decode to a PEM private key"; exit 1; }
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A >/dev/null 2>&1 \
            || { echo "::error::APPLE_CERTIFICATE is not valid base64 (.p12)"; exit 1; }
          gh api "repos/${SOURCE_REPO}" --jq '.full_name' >/dev/null 2>&1 \
            || { echo "::error::SOURCE_CHECKOUT_TOKEN cannot reach SOURCE_REPO — check the PAT scope/expiry and the SOURCE_REPO value"; exit 1; }
          echo "✓ release configuration present and sane (secrets set; PAT reaches source; Apple key decodes)"

      # 2) Guard: the SOURCE tag must exist in the private repo BEFORE we trust the checkout.
      #    (release.mjs pushes the source tag and confirms it before pushing this repo's trigger tag,
      #    but assert here too so a hand-pushed trigger tag can't build a phantom ref.)
      - name: Resolve source tag
        id: srctag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v${INPUT_VERSION}"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Source tag: $TAG"

      - name: Guard — source tag exists in the private repo
        env:
          GH_TOKEN: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }} # private source repo path — kept out of this public file
          TAG: ${{ steps.srctag.outputs.tag }}
        run: |
          gh api "repos/${SOURCE_REPO}/git/ref/tags/${TAG}" --jq '.object.sha' \
            || { echo "::error::source tag ${TAG} not found in the source repo — push the source tag (and confirm it) before the trigger tag"; exit 1; }

      # 3) Check out the PRIVATE source at the exact tag. persist-credentials: false so the read PAT
      #    is not left in git config for later steps.
      - name: Check out private source at the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          ref: ${{ steps.srctag.outputs.tag }}
          token: ${{ secrets.SOURCE_CHECKOUT_TOKEN }}
          persist-credentials: false

      # The keypair verifier lives in THIS repo; the source checkout above took the workspace root, so
      # fetch just this repo's scripts dir alongside it (sparse, separate path, no creds left behind).
      - name: Fetch the keypair verifier (this repo)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: .release-ci
          sparse-checkout: .github/scripts
          persist-credentials: false

      # AUTHORITATIVE updater-keypair gate. Reads the pubkey from the tauri.conf.json THIS build just
      # checked out at the tag — the exact bytes that compile and ship — so it is immune to the daylight
      # a separate preflight leaves (preflighted a different/force-moved/skipped tag, or the no-version
      # path). Runs BEFORE the ~30-min build+notarize so a mismatch fails cheap. Shares one logic with
      # preflight.yml via the script; here the pubkey source is the working tree, not a gh api fetch.
      - name: Verify updater keypair (signing key ↔ checked-out pubkey) — authoritative
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash .release-ci/.github/scripts/verify-updater-keypair.sh --conf src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ pin time
        with:
          toolchain: stable
          # universal-apple-darwin is lipo'd from both arch builds, so install both
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: 'src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci

      # FAIL-CLOSED prerelease gate + version patch. Pure, unit-tested function (see the source repo's
      # src/__tests__/resolveReleaseChannel.test.ts). Reads github.ref — on a tag push that is THIS
      # repo's tag (same shape as before), so the gate is unchanged. Resolved right after `npm ci`
      # (same runtime as before, just earlier) so the changelog gate below can fail cheap.
      - name: Resolve version + release channel
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GIT_REF: ${{ github.ref }}
        run: node scripts/resolve-release-channel.mjs

      - name: Build the GitHub Release body from the marketing changelog
        # The public Release notes ARE the hand-authored CHANGELOG.md section — the same copy the web
        # /offline/changelog page renders, so there's one source of truth and no second file. The
        # PRIVATE source checkout owns the workspace root, so the extractor + CHANGELOG.md live there
        # (same as resolve-release-channel.mjs above); it's pure-local, so the egress block never sees it.
        # Positioned before the frontend build so a missing/crashing extractor fails cheap, not after it.
        #
        # Three outcomes, kept deliberately distinct so a real tooling break can't hide as "no entry":
        #   * prerelease (not in the customer changelog)        -> generic body
        #   * full release whose version has no CHANGELOG entry -> generic body + ::warning::
        #   * extractor missing / crashes / hits the network    -> FAIL the release (loud ::error::)
        # Contract with scripts/extract-changelog-section.mjs: exit 0 + notes on stdout = found;
        # exit 0 + empty (or whitespace-only) stdout = no entry (degrade); any non-zero exit = hard
        # failure. The extractor logs its no-section note to STDERR, so we capture stdout only (no
        # 2>&1) — that note must never leak into the published body. The body is
        # normalized to a single trailing newline, so it is content-faithful to CHANGELOG.md (not
        # necessarily byte-faithful in trailing whitespace). NOTE: the version handed to the extractor
        # is steps.version.outputs.version; the published tag/title use tauri-action's own __VERSION__.
        # These must stay in lockstep (source tag == tauri.conf.json version == resolver version). There's
        # no explicit cross-check, but a divergence fails incidentally: the later "Assert release flag +
        # assets" step looks up `gh release view v<version>`, which 404s if tauri published a different tag.
        id: relnotes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          GENERIC='See the assets to download and install this version.'
          # Random delimiter: a fixed sentinel (e.g. __EOF__) appearing as a CHANGELOG line would
          # otherwise close the GITHUB_OUTPUT value early and corrupt/truncate the published body.
          DELIM="RELNOTES_EOF_$(openssl rand -hex 16)"

          emit() {
            { printf 'body<<%s\n' "$DELIM"; printf '%s\n' "$1"; printf '%s\n' "$DELIM"; } >> "$GITHUB_OUTPUT"
          }

          # Normalize (trim + lowercase) before the compare so a stray 'True'/' true ' still routes right.
          case "$(printf '%s' "$PRERELEASE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')" in
            true) emit "$GENERIC"; exit 0 ;;
          esac

          # A missing extractor is a misconfiguration (renamed script, wrong repo, bad path), NOT a
          # "no entry" — fail loud rather than ship the generic body forever behind a benign warning.
          if [ ! -f scripts/extract-changelog-section.mjs ]; then
            echo "::error::scripts/extract-changelog-section.mjs not found in the source checkout"
            exit 1
          fi

          if NOTES="$(node scripts/extract-changelog-section.mjs "$VERSION")"; then
            if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              emit "$NOTES"
            else
              # Prereleases are gated out above, so an empty result HERE is a full release with no
              # CHANGELOG section — abnormal (a tag that bypassed the normal `npm run release` cut).
              # Stay soft (notes are cosmetic; don't block a signed build), but make it loud.
              echo "::warning title=Full release $VERSION has no CHANGELOG section::Shipping the generic release body. A full release should always carry a changelog section — confirm this tag came from the normal release cut and wasn't pushed manually."
              emit "$GENERIC"
            fi
          else
            echo "::error::extract-changelog-section.mjs failed for $VERSION — refusing to publish with an unverified body"
            exit 1
          fi

      - name: Build frontend (TAURI=1)
        run: npx cross-env TAURI=1 npm run build

      - name: Verify offline bundle guards (release)
        run: npm run check:tauri-bundle -- --release --outDir dist

      # Belt-and-suspenders: the build we are about to SIGN must point its updater at THIS public
      # repo. Catches a stale tauri.conf.json endpoint before a signed build bakes in a dead URL.
      - name: Assert updater endpoint is pinned to the public releases repo
        run: npm run check:updater-endpoint

      # Backstops the zero-network guarantee: frontendDist points at the dist we just built TAURI=1,
      # and beforeBuildCommand reuses it. If either drifts, a build could bundle telemetry while the
      # dist-grep guards stay green.
      - name: Assert offline build wiring is intact
        run: |
          node -e '
            const c = require("./src-tauri/tauri.conf.json");
            if (c.build.beforeBuildCommand !== "node scripts/build-for-tauri.cjs") {
              console.error("::error::beforeBuildCommand changed — the TAURI=1 frontend guarantee is at risk");
              process.exit(1);
            }
            if (c.build.frontendDist !== "../dist") {
              console.error("::error::frontendDist no longer points at the built dist");
              process.exit(1);
            }
          '

      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }} # Key ID — used only to name the file
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A > "$KEY_PATH"
          test -s "$KEY_PATH" || { echo "::error::decoded .p8 is empty — check the APPLE_API_KEY_BASE64 secret"; exit 1; }
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH" || { echo "::error::decoded .p8 is not a PEM key"; exit 1; }
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and release
        # Pinned (not @v0): this step mints signed updater manifests — a floating tag could change
        # latest.json/signing behavior between runs. Bump deliberately. Publishes to THIS repo (the
        # default), so no owner/repo override is needed.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # publishes the release to THIS public repo
          # Updater (minisign) signature
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID code signing (tauri-action imports the cert into a temp keychain)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization via App Store Connect API key (all stored as `release` env secrets)
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }} # Key ID
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }} # Issuer UUID
          # APPLE_API_KEY_PATH is exported by the "Decode App Store Connect API key" step
        with:
          tagName: v__VERSION__
          releaseName: 'TidyText Offline v__VERSION__'
          releaseBody: ${{ steps.relnotes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: Verify the .app signature + notarization staple
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app found to verify"; exit 1; }
          echo "Verifying app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP" # hard gate (signing is deterministic)
          # `stapler validate` is the AUTHORITATIVE, OFFLINE staple gate: it fails closed if tauri-action's
          # native notarize-then-staple lost the ticket-propagation race and produced an unstapled .app
          # (the 2026-06-20 flake). We intentionally DROP the prior `spctl` check: on the egress-blocked
          # runner its online Gatekeeper lookup is itself a flake source (it's what failed 2026-06-20) and
          # adds no signal beyond `stapler validate` — a stapled ticket implies notarization, codesign
          # covers the signature. The artifact a user actually launches (the .app INSIDE the published
          # .dmg) is validated on the shipped bytes in the "Notarize + staple the .dmg" step below.
          xcrun stapler validate "$APP" # AUTHORITATIVE — the .app must carry a stapled ticket

      - name: Assert release flag + assets match the gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # -R is load-bearing: the source checkout owns the workspace, so a bare `gh release view`
          # infers the PRIVATE source repo (which GITHUB_TOKEN can't read) instead of THIS releases
          # repo. $GITHUB_REPOSITORY is this repo (rachelslurs/tidytext-releases).
          GOT=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          [ "$GOT" = "${{ steps.version.outputs.prerelease }}" ] \
            || { echo "::error::release prerelease=$GOT but gate computed ${{ steps.version.outputs.prerelease }}"; exit 1; }
          NAMES=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$NAMES" | grep -qx 'latest.json' || { echo "::error::missing latest.json"; exit 1; }
          echo "$NAMES" | grep -qE '\.dmg$' || { echo "::error::no .dmg attached"; exit 1; }
          echo "$NAMES" | grep -qE '\.app\.tar\.gz$' || { echo "::error::no updater .tar.gz attached"; exit 1; }
          echo "$NAMES" | grep -qE '\.app\.tar\.gz\.sig$' || { echo "::error::no updater .sig attached"; exit 1; }

      # Give the human-download .dmg a stable, version-less name so the branded LS/Cloudflare redirect
      # (/offline/download/mac → /releases/latest/download/<STABLE_DMG>) never needs editing on a bump.
      # Renaming the .dmg does NOT touch the updater artifacts (.app.tar.gz / latest.json), so the
      # updater's manifest↔asset coupling stays exactly as tauri-action minted it.
      - name: Normalize the .dmg asset to a stable name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          STABLE_DMG: TidyText-Offline_universal.dmg
        run: |
          DMG_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | endswith(".dmg")) | .id')
          [ -n "$DMG_ID" ] || { echo "::error::no .dmg asset id found to rename"; exit 1; }
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${DMG_ID}" -f name="${STABLE_DMG}" >/dev/null
          echo "renamed .dmg asset ${DMG_ID} → ${STABLE_DMG}"

      # tauri-action notarizes the .app but NOT the .dmg, so the .dmg has no Apple ticket and its first
      # open would hit Gatekeeper's online-check (or fail offline) — unacceptable for an offline product.
      # NOTARIZE the .dmg, then staple, then re-upload it under the stable name, replacing the unstapled
      # asset. Runs AFTER the rename and BEFORE the reachability check so the served asset is the final
      # stapled one.
      - name: Notarize + staple the .dmg and replace the published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          STABLE_DMG: TidyText-Offline_universal.dmg
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }} # Key ID
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }} # Issuer UUID
          # APPLE_API_KEY_PATH (the decoded .p8) is exported to $GITHUB_ENV by the "Decode …" step.
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "::error::no local .dmg found to notarize"; exit 1; }
          echo "local dmg: $DMG"
          # `notarytool submit --wait` exits 0 once the submission COMPLETES — including status Invalid.
          # A rejected notarization is a finished submission, so we must assert .status == Accepted, not
          # trust the exit code (else `stapler` below fails the same "Record not found" way, one round
          # later). On anything but Accepted, dump the notary log (the REASON) and fail loud.
          submit_json=$(xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --output-format json)
          echo "$submit_json"
          sub_id=$(echo "$submit_json" | jq -r '.id // empty')
          status=$(echo "$submit_json" | jq -r '.status // empty')
          if [ "$status" != "Accepted" ]; then
            echo "::error::dmg notarization not Accepted (status='${status:-none}') — notary log follows"
            [ -n "$sub_id" ] && xcrun notarytool log "$sub_id" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG" # hard gate — the served .dmg CONTAINER must be stapled
          cp "$DMG" "${RUNNER_TEMP}/${STABLE_DMG}"
          # Prove the served copy is byte-identical to the stapled local dmg (not a stale leftover):
          # the two SHA-256s below must match before the clobber-upload.
          shasum -a 256 "$DMG" "${RUNNER_TEMP}/${STABLE_DMG}"
          # AUTHORITATIVE SHIPPED-ARTIFACT GATE: stapling the .dmg CONTAINER is not enough — a browser
          # download is quarantined, so the .app a user EXTRACTS and launches needs its OWN stapled
          # ticket to clear Gatekeeper OFFLINE. Mount the exact bytes we are about to publish (this is
          # the last writer of the asset) and fail closed if the inner .app is unstapled. Closes "green
          # gate but the shipped .dmg's app is unstapled" (the 2026-06-20 class) on the real artifact,
          # BEFORE the upload so a bad .dmg never goes live. (Confirmed against the real a2.1 .dmg: the
          # .app sits at the volume root and `stapler validate` exits non-zero on an unstapled inner app.)
          MNT="${RUNNER_TEMP}/dmg-verify"; mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "${RUNNER_TEMP}/${STABLE_DMG}"
          INNER_APP=$(find "$MNT" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$INNER_APP" ]; then hdiutil detach "$MNT" >/dev/null 2>&1 || true; echo "::error::no .app found inside the published .dmg"; exit 1; fi
          echo "validating stapled ticket on the .dmg's inner app: $INNER_APP"
          if ! xcrun stapler validate "$INNER_APP"; then
            hdiutil detach "$MNT" >/dev/null 2>&1 || true
            echo "::error::the .app inside the published .dmg is NOT stapled — offline first-launch would fail Gatekeeper"; exit 1
          fi
          codesign --verify --deep --strict "$INNER_APP" \
            || { hdiutil detach "$MNT" >/dev/null 2>&1 || true; echo "::error::the .app inside the published .dmg failed codesign --verify"; exit 1; }
          hdiutil detach "$MNT" >/dev/null 2>&1 || true   # cleanup only — the gate above already decided
          gh release upload "$TAG" "${RUNNER_TEMP}/${STABLE_DMG}" --clobber -R "$GITHUB_REPOSITORY"
          echo "notarized + stapled + inner-.app stapled-verified + re-uploaded ${STABLE_DMG}"

      # Phase 6a: prove every shipped asset is ANONYMOUSLY reachable (no Authorization header), so a
      # release can never publish while the repo/assets are unreachable to real users. Asserts the
      # TAG-specific URL (works for prereleases too — /releases/latest excludes prereleases by design).
      - name: Assert published assets are anonymously reachable
        env:
          TAG: v${{ steps.version.outputs.version }}
          STABLE_DMG: TidyText-Offline_universal.dmg
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # Explicitly anonymous: this step sets NO GH_TOKEN, so curl sends no auth — the only way it
          # 200s is if the asset is truly public (guards against the repo silently going private).
          check() {
            local url="$1" code
            for i in 1 2 3 4 5; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url") || code=000
              if [ "$code" = 200 ]; then echo "  200  $url"; return 0; fi
              echo "  ($code) retry $i: $url"; sleep 5
            done
            echo "::error::asset not anonymously reachable (last HTTP $code): $url"; return 1
          }
          check "${base}/latest.json"
          check "${base}/${STABLE_DMG}"
          manifest=$(curl -sSL "${base}/latest.json")
          echo "$manifest" | jq -e '.platforms | length > 0' >/dev/null \
            || { echo "::error::latest.json has no platforms"; exit 1; }
          echo "$manifest" | jq -r '.platforms[].url' | grep -q 'tidytext-releases' \
            || { echo "::error::latest.json platform url is not on the public releases repo"; exit 1; }
          echo "$manifest" | jq -e '[.platforms[].signature | length > 0] | all' >/dev/null \
            || { echo "::error::latest.json has an empty platform signature"; exit 1; }
          # The signed updater archive that latest.json points at must itself be anon-reachable.
          for u in $(echo "$manifest" | jq -r '.platforms[].url'); do check "$u"; done

      # Phase 6a (branded): for a FULL release only (Latest exists), prove the customer-facing
      # tidytext.cc/offline/download/mac path resolves end-to-end through the Cloudflare redirect to
      # the stable-named .dmg. Catches _redirects / rename-target drift the raw checks above can't see.
      - name: Assert the branded download URL resolves (full release only)
        if: ${{ steps.version.outputs.prerelease == 'false' }}
        env:
          STABLE_DMG: TidyText-Offline_universal.dmg
        run: |
          branded="https://tidytext.cc/offline/download/mac"
          # First-hop (Cloudflare 302) target = what the LS field points at — catches redirect drift.
          loc=$(curl -sSI "$branded" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          case "$loc" in
            *"/${STABLE_DMG}") echo "  redirect target OK: $loc" ;;
            *) echo "::error::branded redirect target is not …/${STABLE_DMG} (Location: ${loc:-none}) — _redirects or rename drift"; exit 1 ;;
          esac
          # Full follow (ranged GET, accept 200/206) proves the asset is downloadable. Assert the HTTP
          # code, NOT the URL suffix: the final hop is GitHub's signed CDN
          # (release-assets.githubusercontent.com/<uuid>?…) whose path is a UUID and whose .dmg name
          # lives only in the query string. Use $(curl -w) not `read < <(curl -w …)`: curl's -w has no
          # trailing newline, so read returns non-zero and `bash -e` would kill the step on a SUCCESS.
          bcode=000
          for i in 1 2 3 4 5; do
            bcode=$(curl -sSL -r 0-0 -o /dev/null -w '%{http_code}' "$branded" || echo 000)
            case "$bcode" in 200 | 206) break ;; esac
            echo "  ($bcode) retry $i: $branded"; sleep 5
          done
          case "$bcode" in
            200 | 206) echo "✓ ${branded} → ${loc} → ${bcode}" ;;
            *) echo "::error::branded URL not reachable (last HTTP $bcode): $branded"; exit 1 ;;
          esac
